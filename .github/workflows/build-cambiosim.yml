name: Build CambioSIM APK

on:
  push:
    branches:
      - cambiosim-v4-3-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct project
        run: |
          cat .build-cambiosim/part1.b64 .build-cambiosim/part2.b64 .build-cambiosim/part3.b64 .build-cambiosim/part4.b64 | base64 -d > cambiosim.zip
          mkdir cambiosim
          unzip -q cambiosim.zip -d cambiosim

      - name: Build debug APK
        run: gradle -p cambiosim assembleDebug --stacktrace

      - name: Copy APK
        run: |
          cp cambiosim/app/build/outputs/apk/debug/app-debug.apk CambioSIM-v4.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CambioSIM-v4.3-APK
          path: CambioSIM-v4.3.apk
          if-no-files-found: error
